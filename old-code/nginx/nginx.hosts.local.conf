

server {
  
  listen *:80 default_server;
  server_name _;

  charset utf-8;


    location ^~ /new/upload {
        proxy_pass http://lufi:8080;
       proxy_set_header Host $host:$server_port;
    proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
  }

      location ^~ /new/download {
        proxy_pass http://lufi:8080;
       proxy_set_header Host $host:$server_port;
    proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
  }

    location ^~ /new {
    limit_except GET HEAD POST PUT DELETE PATCH {
      allow 127.0.0.1;
    }
    proxy_pass http://lufi:8080;
       proxy_set_header Host $host:$server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
   }
  location ~ ^/([\/]) {
  proxy_pass http://lufi:8080$request_uri;
    proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;

  }

  location ~ ^/([0-9A-Za-z]) {

    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Real-IP $remote_addr;


  return 301  http://$host/old$request_uri;
    }



  location / {
    return 301 http://$host/new$request_uri;
  }


  location ^~/old {
  proxy_pass http://b.seiu.org/;
   #proxy_set_header Host $host:$server_port;
   proxy_set_header X-Real-IP $remote_addr;
  }






}
