server { listen *:8080 default_server;
return 301 https://$host$request_uri;}

server {
  
  listen *:80 default_server;
  server_name _;

  charset utf-8;


    location ^~ /new/upload {
        proxy_pass http://lufi:8080;
       proxy_set_header Host $host:$server_port;
    proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
  }

      location ^~ /new/download {
        proxy_pass http://lufi:8080;
       proxy_set_header Host $host:$server_port;
    proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
  }

    location ^~ /new {
    limit_except GET HEAD POST PUT DELETE PATCH {
      allow 127.0.0.1;
    }
    proxy_pass http://lufi:8080;
       proxy_set_header Host $host:$server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
   }
  location ~ ^/([\/]) {
  proxy_pass http://lufi:8080$request_uri;
    proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;

  }

  location ~ ^/([0-9A-Za-z]) {
resolver 8.8.8.8;
    proxy_set_header Host b.seiu.org:$server_port;
    proxy_set_header X-Real-IP $remote_addr;
  proxy_pass https://bitdrop-old.seiu.org$request_uri;
    }



  location / {
    return 301 http://$host/new$request_uri;
  }


  location ^~/old {
  proxy_pass https://bitdrop-old.seiu.org$request_uri;
  resolver 8.8.8.8;
   #proxy_set_header Host $host:$server_port;
   proxy_set_header Host b.seiu.org:$server_port;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header Host b.seiu.org;
  }




}
