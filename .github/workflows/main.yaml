name: CI/CD Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Add secrets to repository checkout
        env:
          environment: ${{ secrets.ENVIRONMENT }}
          recaptcha: ${{ secrets.RECAPTCHA }}
        run: |
          echo "${environment}" > $PWD/frontend/.env
          echo "${recaptcha}" > $PWD/server/.env
          EMAIL_AUTH_TOKEN=$(head -c12 /dev/random | base64)
          echo "EMAIL_AUTH_TOKEN=$EMAIL_AUTH_TOKEN" >> $PWD/frontend/.env
          echo "EMAIL_AUTH_TOKEN=$EMAIL_AUTH_TOKEN" >> $PWD/server/.env

      - name: Run backend tests
        run: |
          export PATH="$PATH:$HOME/.local/bin"
          if [ "$(which uv)" == "" ]; then
            curl -LsSf https://astral.sh/uv/install.sh | sh;
          fi
          source $HOME/.local/bin/env
          export PYTHONPATH="$PYTHONPATH:$PWD/server"
          uv run pytest .

      - name: Deploy to main
        if: github.ref == 'refs/heads/main'
        env:
          INSTANCE: ubuntu@44.228.185.80
        run: |
          rsync -a $PWD $INSTANCE:/home/ubuntu --delete
          ssh -o StrictHostKeyChecking=no $INSTANCE -t 'bash -l -c "
              cd $HOME/bitdrop
              bin/make-certs
              ./deploy.sh
          "'
